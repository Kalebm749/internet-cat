# Internet Cat: everything on one Ubuntu laptop. See README.md and docs/rewrite-contracts.md.
#   docker compose up -d --build        start (the engine dozes until Ollama and the models are ready)
#   deploy/pull-models.sh               one-off: pull the models named in config/settings.yaml (nit.models)
name: internet-cat

# Shared by the services that run our own image.
x-app: &app
  build:
    context: .
    target: runtime
    args:
      CAT_UID: ${CAT_UID:-1000}
      CAT_GID: ${CAT_GID:-1000}
  image: internet-cat:local
  restart: unless-stopped
  environment:
    CAT_CONFIG_DIR: /app/config
    CAT_STRUCTURED_LOGS: "1"      # JSON logs to stdout and data/logs/<service>.jsonl
    TZ: ${TZ:-UTC}
  volumes:
    - ./data:/app/data            # nit.db, mail.db, backups, logs: visible and back-up-able from the host
    - ./config:/app/config:ro     # settings and prompts: edit without rebuilding; restart the engine to apply
    - ./content:/app/content:ro   # the world and the character sheet: edit, then restart the engine

services:
  ollama:
    image: ollama/ollama:${OLLAMA_TAG:-latest}
    restart: unless-stopped
    # Not published to the network (Ollama has no authentication). The other services reach it as
    # http://ollama:11434. To debug from the host, add:  ports: ["127.0.0.1:11434:11434"]
    environment:
      OLLAMA_KEEP_ALIVE: "-1"           # keep models loaded: no reload delay between decisions
      OLLAMA_MAX_LOADED_MODELS: "2"     # decision model + embedding model; the sleep model swaps in at night
      OLLAMA_NUM_PARALLEL: "1"          # one request at a time; saves VRAM
      TZ: ${TZ:-UTC}
    volumes:
      - ollama:/root/.ollama            # named volume: the downloaded models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]   # the image has no curl
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  engine:
    <<: *app
    command: ["python", "-m", "cat.nit"]
    # Start order only, NOT health-gated: the engine must start even if Ollama is down or has no
    # models yet, and doze until it is ready (the engine's own offline handling).
    depends_on:
      ollama:
        condition: service_started
    stop_grace_period: 45s              # lets an in-flight decision finish; every step is atomic anyway
    healthcheck:
      test: ["CMD", "python", "-m", "cat.healthcheck", "engine"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    <<: *app
    command: ["uvicorn", "cat.web.app:app", "--host", "0.0.0.0", "--port", "8080", "--no-access-log"]
    ports:
      - "${WEB_PORT:-8080}:8080"        # the only port exposed to the network
    healthcheck:
      test: ["CMD", "python", "-m", "cat.healthcheck", "http", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Developer dashboard (see README "Using the dev dashboard"). Published on 127.0.0.1 ONLY by default.
  # Set DEVDASH_BIND=0.0.0.0 in .env to reach it from your LAN: it then REQUIRES DEVDASH_USER/DEVDASH_PASS
  # (the service refuses to start without them). Never expose it beyond your local network.
  devdash:
    <<: *app
    environment:
      CAT_CONFIG_DIR: /app/config
      CAT_STRUCTURED_LOGS: "1"
      TZ: ${TZ:-UTC}
      DEVDASH_BIND: ${DEVDASH_BIND:-127.0.0.1}
      DEVDASH_USER: ${DEVDASH_USER:-}
      DEVDASH_PASS: ${DEVDASH_PASS:-}
    command: ["uvicorn", "cat.devdash.app:app", "--host", "0.0.0.0", "--port", "8090", "--no-access-log"]
    ports:
      - "${DEVDASH_BIND:-127.0.0.1}:8090:8090"
    healthcheck:
      test: ["CMD", "python", "-m", "cat.healthcheck", "http", "http://127.0.0.1:8090/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # One-off: docker compose --profile init run --rm model-pull   (or deploy/pull-models.sh)
  model-pull:
    <<: *app
    profiles: ["init"]
    restart: "no"
    command: ["python", "-m", "cat.pullmodels"]
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      disable: true

volumes:
  ollama:
