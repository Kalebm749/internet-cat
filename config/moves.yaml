    target: object
    reach: here
    any_tags: ["container"]
    effort: low
    minutes: [3, 10]
    effects: {"curiosity": "++"}
    does: none
    reveals: true
    outcome: "You looked inside {target}."
  splash:
    label: "splash about in {target}"
    target: object
    reach: here
    any_tags: ["water"]
    effort: medium
    minutes: [5, 15]
    effects: {"joy": "++"}
    does: none
    mood: playful
    hurts: [{"if": "always", "target_tags": ["cold"], "drains": {"peace": 6}, "energy": 4, "outcome": "The water was colder than it looked, and now you are soaked through."}]
    outcome: "You splashed about in {target}."
  watch_ripples:
    label: "watch the ripples in {target}"
    target: object
    reach: here
    any_tags: ["water"]
    effort: none
    minutes: [10, 25]
    effects: {"peace": "+", "wonder": "++"}
    does: none
    outcome: "You watched the ripples in {target}."
  listen_to_water:
