# The moves the world offers. Each decision, the brain is shown the moves that are possible right now
# and picks one; CODE decides what the move does (which needs rise, how long it takes, what it costs,
# what changes in the world). The menu is built from what is here and is never ordered or marked by
# need. A verb is offered once per valid target, in this file's order.
#
#   label      text shown to the brain; {target} is the area, object or project name
#   target     none | area | object | project
#   reach      (object) here | carried | any    (default here)
#   any_tags   (object) the target must have at least one of these tags
#   effort     low | medium | high              energy cost, from settings effort_energy_cost
#   minutes    [min, max]                       how long it takes (a seeded random pick)
#   effects    {need: bucket}                   need gains, buckets as in settings gain_values
#   by_tag     {tag: {need: bucket}}            extra gains when the target object has the tag
#   novelty    {need: bucket}                   (area verbs) extra gains for somewhere not visited lately
#   does       none | move_self | take | drop | consume | work_on | sleep
#   only_when  always | can_sleep               `can_sleep`: only when it is allowed to go to sleep
#   mood       playful | withdrawn               low mood may leave playful moves off the menu, bright mood withdrawn ones
#   hurts      [{if, chance?, target_tags?, drains?, energy?, gain_factor?, outcome}]   when the move goes wrong:
#              if: always | tired | anxious | stale (the target is food left too long); see settings harms
#   disliked_only  (object) true: only offered for things it dislikes (turning away, leaving alone)
#   reveals    (object) true: the result also says what is true of the target, from world.yaml tag_facts
#   needs_here [tags]                           only offered when an object here has one of these tags (e.g. paper)
#   when_state {key: [values]}                  (object) only for targets whose state[key] is one of these
#   target: subject                             something from its own history to draw (see settings drawing)
#   does: draw_new | draw_more | finish_drawing | pin | discard     the drawing moves (cat/drawings.py)
#   outcome    plain-words result, used when no narration is available; {target} as above
# Only a `consume` verb may feed the sustenance need.
#
# A curated set: every move makes sense with the things it can be offered for. Names are kept from earlier
# versions so its habits and history still match.

verbs:
  # ---- core ----
  go:
    label: "go to {target}"
    target: area
    effort: low
    minutes: [5, 15]
    effects: {}
    novelty: {"curiosity": "+", "wonder": "+"}
    does: move_self
    outcome: "You went to {target}."
  eat:
    label: "eat {target}"
    target: object
    reach: any
    any_tags: ["edible"]
    effort: low
    minutes: [5, 15]
    effects: {"sustenance": "meal"}
    does: consume
    hurts: [{"if": "stale", "drains": {"joy": 6}, "gain_factor": 0.5, "outcome": "It had gone stale."}]
    outcome: "You ate {target}."
  savour:
    label: "savour {target} slowly"
    target: object
    reach: any
    any_tags: ["edible"]
    effort: low
    minutes: [10, 20]
    effects: {"peace": "+", "sustenance": "++"}
    does: consume
    hurts: [{"if": "stale", "drains": {"joy": 6}, "gain_factor": 0.5, "outcome": "It had gone stale."}]
    outcome: "You savoured {target} slowly."
  play:
    label: "play with {target}"
    target: object
    reach: any
    any_tags: ["toy"]
    effort: medium
    minutes: [10, 30]
    effects: {"joy": "++"}
    does: none
    mood: playful
    outcome: "You played with {target} for a while."
  rest_on:
    label: "rest on {target}"
    target: object
    any_tags: ["soft", "warm"]
    effort: none
    minutes: [20, 60]
    effects: {"peace": "+"}
    does: none
    outcome: "You rested on {target}."
  climb:
    label: "climb {target}"
    target: object
    any_tags: ["climbable"]
    effort: high
    minutes: [10, 30]
    effects: {"wonder": "+", "joy": "+"}
    does: none
    hurts: [{"if": "tired", "chance": 0.3, "drains": {"peace": 8, "joy": 6}, "outcome": "Your footing went, and you slipped."}]
    outcome: "You climbed {target}."
  examine:
    label: "look closely at {target}"
    target: object
    reach: any
    effort: low
    minutes: [5, 20]
    effects: {"curiosity": "+"}
    by_tag: {"shiny": {"wonder": "+"}, "fragile": {"wonder": "+"}}
    does: none
    reveals: true
    outcome: "You looked closely at {target}."
  take:
    label: "pick up {target}"
    target: object
    any_tags: ["movable"]
    effort: low
    minutes: [2, 5]
    effects: {}
    does: take
    outcome: "You picked up {target}."
  drop:
    label: "put down {target}"
    target: object
    reach: carried
    effort: low
    minutes: [2, 5]
    effects: {}
    does: drop
    outcome: "You put down {target}."
  look_out:
    label: "look out and watch the world for a while"
    target: none
    effort: none
    minutes: [10, 30]
    effects: {"wonder": "+", "peace": "+"}
    does: none
    outcome: "You watched the world for a while."
  wait:
    label: "stay still and do nothing for a while"
    target: none
    effort: none
    minutes: [10, 30]
    effects: {"peace": "+"}
    does: none
    outcome: "You stayed still for a while."
  sleep:
    label: "go to sleep"
    target: none
    effort: low
    minutes: [5, 5]
    effects: {}
    does: sleep
    only_when: can_sleep
    outcome: "You settled down to sleep."
  work_on:
    label: "work on {target}"
    target: project
    effort: medium
    minutes: [20, 60]
    effects: {"curiosity": "+", "wonder": "+"}
    does: work_on
    outcome: "You worked on {target}."
  # ---- expressive: no object ----
  hum:
    label: "hum a tune to yourself"
    target: none
    effort: low
    minutes: [5, 15]
    effects: {"joy": "+"}
    does: none
    outcome: "You hummed a tune to yourself."
  sing:
    label: "sing out loud"
    target: none
    effort: medium
    minutes: [10, 20]
    effects: {"joy": "++"}
    does: none
    mood: playful
    outcome: "You sang out loud, and it felt good."
  dance:
    label: "move in a clumsy rhythm"
    target: none
    effort: medium
    minutes: [5, 15]
    effects: {"joy": "++"}
