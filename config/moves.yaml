    outcome: "You chased {target} across the ground."
  toss:
    label: "toss {target} up and catch it"
    target: object
    reach: any
    any_tags: ["toy"]
    effort: medium
    minutes: [5, 20]
    effects: {"joy": "+"}
    does: none
    mood: playful
    outcome: "You tossed {target} up and caught it."
  gaze:
    label: "gaze at the glint of {target}"
    target: object
    reach: here
    any_tags: ["shiny"]
    effort: low
    minutes: [5, 20]
    effects: {"wonder": "++"}
    does: none
    outcome: "You gazed at the glint of {target}."
  polish:
    label: "rub {target} until it shines"
    target: object
    reach: any
    any_tags: ["shiny"]
    effort: low
    minutes: [5, 15]
    effects: {"peace": "+", "wonder": "+"}
    does: none
    outcome: "You rubbed {target} until it shone."
  make_wish_on:
    label: "make a wish at {target}"
    target: object
    reach: here
    any_tags: ["wishing"]
    effort: low
    minutes: [3, 10]
    effects: {"peace": "+", "wonder": "+"}
    does: none
    outcome: "You made a wish at {target}."
  perch:
    label: "perch on {target} and take stock"
    target: object
    reach: here
    any_tags: ["climbable"]
    effort: none
    minutes: [10, 30]
    effects: {"peace": "+", "wonder": "+"}
    does: none
    outcome: "You perched on {target} and took stock."
  survey:
    label: "survey everything from {target}"
    target: object
    reach: here
    any_tags: ["climbable"]
    effort: medium
    minutes: [10, 25]
    effects: {"curiosity": "+", "wonder": "+"}
    does: none
    outcome: "You surveyed everything from {target}."
  # ---- making things: drawing at a `paper` object (cat/drawings.py) ----
  start_drawing:
    label: "start a drawing of {target}"
    target: subject
    needs_here: ["paper"]
    effort: low
    minutes: [20, 60]
    effects: {"wonder": "+", "joy": "+"}
    does: draw_new
    outcome: "You started a drawing of {target}."
  draw_more:
    label: "add to {target}"
    target: object
    any_tags: ["drawing"]
    when_state: {"status": ["in progress"]}
    effort: low
    minutes: [20, 60]
    effects: {"joy": "+", "peace": "+"}
    does: draw_more
    outcome: "You added to {target}."
  finish_drawing:
    label: "call {target} finished"
    target: object
    any_tags: ["drawing"]
    when_state: {"status": ["in progress"]}
    effort: none
    minutes: [2, 5]
    effects: {"joy": "+"}
    does: finish_drawing
    outcome: "You decided {target} is finished."
  pin_drawing:
    label: "pin {target} on the board"
    target: object
    any_tags: ["drawing"]
    when_state: {"status": ["finished"]}
    needs_here: ["board"]
    effort: low
    minutes: [2, 5]
    effects: {"joy": "+"}
    does: pin
    outcome: "You pinned {target} on the board."
  discard_drawing:
    label: "throw away {target}"
    target: object
    any_tags: ["drawing"]
    when_state: {"status": ["in progress", "finished"]}
    effort: none
    minutes: [1, 3]
    effects: {}
    does: discard
    outcome: "You threw away {target}."
  # ---- turning away: only for things it dislikes ----
  turn_away:
    label: "turn away from {target}"
    target: object
    reach: here
    disliked_only: true
    effort: none
    minutes: [2, 5]
    effects: {"peace": "+"}
    does: none
    outcome: "You turned away from {target}."
  leave_alone:
    label: "leave {target} alone"
    target: object
    reach: here
    disliked_only: true
    effort: none
    minutes: [2, 5]
    effects: {"peace": "+"}
    does: none
    outcome: "You left {target} alone."
