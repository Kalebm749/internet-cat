    mood: playful
    outcome: "You moved in a clumsy rhythm."
  listen:
    label: "hold still and listen"
    target: none
    effort: none
    minutes: [5, 20]
    effects: {"curiosity": "+", "peace": "+"}
    does: none
    outcome: "You held still and listened."
  look_up:
    label: "look up at the sky"
    target: none
    effort: none
    minutes: [5, 20]
    effects: {"wonder": "+"}
    does: none
    outcome: "You looked up at the sky for a while."
  breathe:
    label: "take a few slow breaths"
    target: none
    effort: none
    minutes: [3, 8]
    effects: {"peace": "+"}
    does: none
    outcome: "You took a few slow breaths."
  daydream:
    label: "let your mind wander"
    target: none
    effort: none
    minutes: [10, 30]
    effects: {"peace": "+", "wonder": "+"}
    does: none
    outcome: "You let your mind wander."
  remember:
    label: "try to remember something from long ago"
    target: none
    effort: low
    minutes: [5, 15]
    effects: {"curiosity": "+"}
    does: none
    outcome: "You tried to remember something from long ago."
  ponder:
    label: "think hard about a question"
    target: none
    effort: medium
    minutes: [10, 30]
    effects: {"curiosity": "++"}
    does: none
    outcome: "You thought hard about a question."
  pace:
    label: "move back and forth restlessly"
    target: none
    effort: low
    minutes: [5, 15]
    effects: {}
    does: none
    outcome: "You moved back and forth restlessly."
  sulk:
    label: "sulk for a while"
    target: none
    effort: low
    minutes: [5, 15]
    effects: {}
    does: none
    mood: withdrawn
    outcome: "You sulked for a while."
  make_up_game:
    label: "make up a game with yourself"
    target: none
    effort: medium
    minutes: [10, 25]
    effects: {"joy": "++"}
    does: none
    mood: playful
    outcome: "You made up a game and played it alone."
  # ---- with things ----
  tap:
    label: "tap on {target} and listen"
    target: object
    reach: here
    effort: low
    minutes: [3, 8]
    effects: {"curiosity": "+"}
    does: none
    reveals: true
    outcome: "You tapped on {target} and listened."
  turn_over:
    label: "turn {target} over and over"
    target: object
    reach: any
    any_tags: ["movable"]
    effort: low
