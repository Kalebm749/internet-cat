  ring:
    label: "ring {target}"
    target: object
    any_tags: ["rings"]
    effort: low
    minutes: [2, 5]
    effects: {"joy": "++", "wonder": "+"}
    does: none
    hurts: [{"if": "anxious", "drains": {"peace": 10}, "gain_factor": 0, "outcome": "The ring went straight through you; it hurt."}]
    outcome: "You rang {target}, and the sound went out over everything."
  bat:
    label: "bat {target} back and forth"
    target: object
    reach: any
    any_tags: ["toy"]
    effort: medium
    minutes: [5, 20]
    effects: {"joy": "+"}
