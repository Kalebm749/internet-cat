# PLACEHOLDER — replace. A tiny house and garden.
areas:
  living_room:
    name: the living room
    description: "A cosy room with a sofa and a big window."
    exits: [kitchen, hallway]
  kitchen:
    name: the kitchen
    description: "Tiles, a table, and the smell of food."
    exits: [living_room]
  hallway:
    name: the hallway
    description: "A narrow hallway with a door to the garden."
    exits: [living_room, garden]
  garden:
    name: the garden
    description: "A small overgrown garden with a tree."
    exits: [hallway]

objects:
  - {id: sofa,    name: the sofa,         area: living_room, tags: [soft, warm, climbable], state: {}}
  - {id: window,  name: the big window,   area: living_room, tags: [climbable], state: {open: "false"}}
  - {id: cushion, name: a cushion,        area: living_room, tags: [soft, movable], state: {}}
  - {id: bowl,    name: a bowl of fish,   area: kitchen,     tags: [edible, movable], state: {}}
  - {id: ball,    name: a red ball,       area: hallway,     tags: [toy, movable], state: {}}
  - {id: tree,    name: the old tree,     area: garden,      tags: [climbable], state: {}}

weather: [clear, cloudy, rain]   # first entry is the starting weather

events:
  - {text: "It starts to rain.", chance: 0.03, set_weather: rain}
  - {text: "The rain stops.", chance: 0.08, only_weather: rain, set_weather: clear}
  - {text: "A bird lands on the windowsill.", chance: 0.04, area: living_room, hours: [8, 18]}
  - {text: "Someone leaves a bowl of fish.", chance: 0.03, area: kitchen,
     spawn: {name: a bowl of fish, tags: [edible, movable], area: kitchen}}
