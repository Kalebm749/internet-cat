# A small town square with a mysterious fountain at its centre. Every object here is permanent and has a purpose:
# it serves a need, a craft, or a mystery. Nothing is decoration. The engine keeps an existing world in step with
# this file at every start (cat/engine.py `_sync_world`): changed objects are updated, new ones added, removed ones
# taken out, but never anything the creature made or is carrying. A backup is taken first.
#
#   object fields: id, name, area, tags, state (optional), purpose (what it is for; documentation only),
#   produces (optional: a source of things that come and go, e.g. food):
#     {name, tags, at_hour: H (once a day at or after this hour) | every_hours: N, max: most waiting at once}
#
# Areas may be `sheltered: true` (out of the rain) and `noisy: {hours, per_hour: {need: points}, text}` (wears on it).
# Layout: the fountain is the hub (market, clock tower, garden, notice board, stationer's back room); the back alley
# links the market and the garden; the nook is under the clock tower's stair.
areas:
  fountain:
    name: the fountain
    description: "The heart of the square. An old stone fountain stands in a wide basin, its water always faintly moving even when there is no wind. Nobody remembers who built it."
    exits: [market, clock_tower, garden, notice_board, studio]
  market:
    name: the market stalls
    description: "Canvas-roofed stalls, loud by day with smells of bread and talk."
    exits: [fountain, alley]
    sheltered: true                   # out of the rain (settings harms.rain)
    noisy: {hours: [8, 17], per_hour: {peace: 3}, text: "The noise of the market grates on you."}   # busy hours wear on peace
  clock_tower:
    name: the clock tower
    description: "A tall stone tower with a great clock face. Its stair winds up to where the whole square can be seen, and a brass bell hangs at the top."
    exits: [fountain, nook]
  nook:
    name: the nook under the stair
    description: "A dry hollow under the clock tower's winding stair, out of the wind and the rain. The bell's hum carries down here."
    exits: [clock_tower]
    sheltered: true
  garden:
    name: the garden
    description: "A quiet walled garden behind the old church, overgrown and warm, with an old tree."
    exits: [fountain, alley]
  notice_board:
    name: the notice board
    description: "A covered arcade where the town pins its notes, with a post box and a sheltered bench."
    exits: [fountain]
    sheltered: true
  studio:
    name: the stationer's back room
    description: "A cramped back room behind a stationer's shop, smelling of paper and dust. A wide table stands under the window, and a cork board hangs on the wall."
    exits: [fountain]
    sheltered: true
  alley:
    name: the back alley
    description: "A narrow shadowy lane between buildings, full of strange small sounds. A deep puddle lies across it that never seems to dry."
    exits: [market, garden]

objects:
  # the fountain: rest, and the square's oldest mystery
  - {id: fountain,    name: the mysterious fountain,   area: fountain, tags: [wet, water, wishing],
     state: {wish: "none"}, purpose: "mystery: water always moving with no wind; a glint deep down"}
  - {id: coins,       name: a scatter of old coins in the basin, area: fountain, tags: [shiny, wet],
     purpose: "mystery: whose coins, and why here"}
  - {id: plaque,      name: a worn stone plaque,       area: fountain, tags: [],
     purpose: "mystery: words worn too far to read"}
  - {id: stone_bench, name: a sun-warmed stone bench,  area: fountain, tags: [warm], purpose: "rest"}
  # the market: food
  - {id: stall,       name: the bread stall,           area: market, tags: [hideable], purpose: "food: a loaf each dawn",
     produces: {name: a fresh loaf of bread, tags: [edible, movable], at_hour: 6, max: 2}}
  # the clock tower: effort, joy, and a mystery
  - {id: stair,       name: the winding stair,         area: clock_tower, tags: [climbable], purpose: "effort, a view"}
  - {id: clock,       name: the great clock face,      area: clock_tower, tags: [],
     purpose: "mystery: does it keep the right time?"}
  - {id: bell,        name: the brass bell,            area: clock_tower, tags: [shiny, rings], purpose: "joy: ring it"}
  # the nook: its own place to sleep
  - {id: nest,        name: a nest of straw,           area: nook, tags: [soft, warm, nest], purpose: "sleep: rests deeper here"}
  # the garden: rest, wonder, play, food
  - {id: tree,        name: the old tree,              area: garden, tags: [climbable], purpose: "climb; food: fruit falls",
     produces: {name: a fallen apple, tags: [edible, movable], every_hours: 9, max: 2}}
  - {id: grass,       name: a patch of warm soft grass, area: garden, tags: [soft, warm], purpose: "rest"}
  - {id: roses,       name: a tangle of rose bushes,   area: garden, tags: [fragile], purpose: "wonder"}
  - {id: yarn,        name: a loose ball of yarn,      area: garden, tags: [toy, movable], purpose: "play"}
  # the notice board: shelter, and messages that could one day arrive
  - {id: board,       name: the notice board,          area: notice_board, tags: [], purpose: "mystery: the town's notes"}
  - {id: note,        name: a scrap of paper with faded writing, area: notice_board, tags: [movable],
     purpose: "mystery: a message nobody can quite read"}
  - {id: postbox,     name: the red post box,          area: notice_board, tags: [container],
     purpose: "mystery: what goes in, and does anything come out"}
  - {id: bench,       name: a sheltered wooden bench,  area: notice_board, tags: [warm], purpose: "rest out of the rain"}
  # the stationer's back room: making things
  - {id: paper,       name: a stack of drawing paper and charcoal, area: studio, tags: [paper], purpose: "craft: drawing"}
  - {id: paints,      name: a tin of watercolours,     area: studio, tags: [paints], purpose: "craft: colour"}
  - {id: worktable,   name: a wide work table,         area: studio, tags: [], purpose: "craft: where drawings wait"}
  - {id: corkboard,   name: a cork pin board,          area: studio, tags: [board], purpose: "craft: where drawings are shown"}
  # the back alley: the strange place
  - {id: puddle,      name: a deep puddle,             area: alley, tags: [wet, water, cold],
     purpose: "mystery: it never dries, and it is deeper than it looks"}

# What is true of a thing with each tag, as the end of a sentence starting "It ...". Moves with `reveals: true`
# (looking closely, turning something over, ...) report these, so the diary and the entity's journal have
# something true to say instead of something invented. A tag with no line here is not reported.
tag_facts:
  edible: can be eaten
  climbable: can be climbed
  warm: is warm
  movable: can be moved
  fragile: is fragile
  soft: is soft
  container: has room inside it
  toy: is something to play with
  hideable: has room to hide in
  shiny: catches the light
  wet: is wet
  paper: is something to draw on
  board: has room to pin things up
  drawing: was drawn by your own hand
  paints: holds colours to paint with
  rings: rings when it is struck
  nest: is a place to sleep
  water: holds water
  wishing: is the kind of place people make wishes
  cold: is cold

weather: [clear, cloudy, rain]   # first entry is the starting weather

# Small things that happen (the world director adds more; it never creates objects). Food comes from `produces`.
events:
  - {text: "It starts to rain.", chance: 0.03, set_weather: rain, drains: {joy: 3}}   # drains: points the world takes from needs when it fires
  - {text: "The rain stops.", chance: 0.08, only_weather: rain, set_weather: clear}
  - {text: "A pigeon lands on the edge of the fountain, looks around, and flies off.", chance: 0.04, area: fountain, hours: [7, 19]}
  - {text: "Something glints for a moment deep in the fountain's water.", chance: 0.03, area: fountain}
  - {text: "The clock strikes, slow and deep, and the sound rolls over the square.", chance: 0.03, area: clock_tower}
  - {text: "A stallholder calls out a price, and someone laughs.", chance: 0.04, area: market, hours: [8, 17]}
  - {text: "Something small scuttles in the dark of the alley, and is gone.", chance: 0.05, area: alley}
  - {text: "The puddle shivers, though nothing has touched it.", chance: 0.03, area: alley}
