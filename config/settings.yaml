# Engine-wide settings (cat/config.py validates them). The creature's own tuning is the `nit:` block below.
# World content (places, actions, the character) lives in content/, not here. See docs/rewrite-contracts.md.

# --- LLM host: the `ollama` service in compose.yaml (use http://127.0.0.1:11434 outside Docker) ---
ollama_host: http://ollama:11434
ollama_think: false            # qwen3: disable thinking so JSON `format` output stays clean
llm_timeout_seconds: 600       # the 14B sleep model, partly on the CPU, can take minutes
health_timeout_seconds: 3
llm_temperature: {decide: 0.8, sleep: 0.5, capability: 0.8}   # by task (sleep_* tasks use "sleep")
llm_num_ctx: 4096

# --- files ---
heartbeat_file: data/engine.heartbeat   # written by the engine every loop step; read by its healthcheck
log_dir: data/logs              # structured JSON logs: <service>.jsonl, size-rotated
log_level: INFO
log_max_bytes: 5000000
log_backup_count: 5
backup_keep: 14                 # deploy/backup.sh and the pre-migration backups keep this many

# --- container healthchecks ---
healthcheck:
  engine_max_age_seconds: 120   # the engine is unhealthy if its heartbeat is older than this
  http_timeout_seconds: 5
pull_timeout_seconds: 3600      # model download may take a long time

# --- the website (cat/web) ---
web:
  port: 8080
  refresh_seconds: 10           # the page asks for news this often
  diary_page: 40                # entries per diary page
  mail_db: data/mail.db         # visitor letters: the ONLY file the website writes
  mail_max_chars: 500
  mail_name_max: 40
  mail_per_ip_per_hour: 3
  mail_per_hour: 30             # all visitors together
  mail_poll_seconds: 30         # the engine imports new letters this often (real seconds)
  mail_blocklist: []            # lowercase words; a letter containing one is refused

# --- the dev dashboard (cat/devdash; 127.0.0.1 only unless DEVDASH_BIND + credentials) ---
devdash:
  port: 8090
  refresh_seconds: 5
  page_size: 50

# --- the creature: every number of the engine loop, body, decisions, sleep, memory and repetition ---
# (docs/rewrite-contracts.md; validated by cat/tuning.py)
nit:
  db_path: data/nit.db
  content_dir: content
  time_scale: 24                 # sim minutes per real minute: one real hour is one sim day (§3.4)
  body:                          # mood -1..1, energy 0..1, hunger 0..1 (§2.2); rates are per SIM hour
    start: {mood: 0.1, energy: 0.8, hunger: 0.2}
    step_minutes: 10             # time passes in steps of at most this many sim minutes (hunger and drag interact)
    mood_baseline: 0.1           # mood drifts toward this ...
    mood_drift_per_hour: 0.05    # ... by this much per hour, never overshooting
    hunger_per_hour: 0.035       # awake: about 0.56 over a 16-hour day, so two offerings a day keep it low
    hunger_sleep_factor: 0.4     # asleep, hunger rises at this fraction of the awake rate
    hunger_per_effort: 0.5       # hunger added per unit of energy spent on effort
    hunger_mood_threshold: 0.6   # above this hunger, mood is dragged down ...
    hunger_mood_drag: 0.15       # ... by drag x (hunger - threshold) per hour
    awake_energy_per_hour: 0.03  # being awake costs this much energy per hour (effort comes on top)
    sleep_energy_per_hour: 0.12  # an 8-hour night restores about 0.96 ...
    hungry_sleep_penalty: 0.5    # ... less by penalty x hunger (fully hungry: half as much)
  models:                        # §7
    decision_model: qwen3:4b     # waking decisions, check-ins, capability calls
    sleep_model: qwen3:14b       # sleep stages
    embed_model: nomic-embed-text
    art_model: qwen3:14b         # larger model for translating Nit's own drawing intention into an image
    vision_model: qwen2.5vl:3b   # Nit's eyes on its own drawings; loaded for one look, then unloaded
  decisions:                     # §3
    interval_seconds: 15         # REAL seconds between decisions while no activity runs (a target, never an interrupt)
    check_in_minutes: 30         # SIM minutes an activity runs before a short "continue or stop?" check-in
    event_salience_min: 0.4      # a perceived event at least this salient may interrupt an activity
    retries: 2                   # extra attempts after an invalid answer, each told what was wrong
    thought_max_chars: 400
    reasoning_max_chars: 400
    recent_activities: 5         # completed activities shown in the Mind
    prompt_tokens: 1500          # budget for the decision prompt (about 4 characters per token)
  art:                           # §4.10: the drawing simulator and Gwen's limits
    canvas: 512                  # px; operations use this coordinate space
    max_points: 120              # per stroke or polygon
    max_points_per_pass: 3000    # all points Gwen may place in one pass
    max_total: 600               # operations on one sheet across all its versions
    max_tokens: 3500             # Gwen's answer, in tokens
    effort_ops: {quick: 14, careful: 32, patient: 56}   # operations per pass, by the effort Nit chooses
  mail:                          # §4.8
    on_mind: 3                   # read, unanswered letters shown in the Mind (newest first)
    on_mind_chars: 300           # each shortened to this many characters
    on_mind_days: 3              # and only for this many sim days after reading
  loop:                          # the engine loop (cat/loop.py)
    step_seconds: 2.5            # REAL seconds between loop steps (1 sim minute at time_scale 24)
    doze_seconds: 30             # REAL seconds without decisions after the brain failed (Ollama down)
    max_step_minutes: 60         # SIM minutes one step may advance (a stalled process catches up in pieces)
  sleep:                         # §5: sleep as an activity, and the sleep cycle that runs during it
    min_hours: 6                 # SIM hours asleep before it may wake ...
    wake_energy: 0.9             # ... once energy is back to this, outside the night window ...
    max_hours: 12                # ... and at the latest after this long (the clock waits for the sleep cycle)
    night_hours: [21, 6]         # the night: it does not wake on its own in here (unless max_hours)
    threaded: true               # run the sleep cycle beside the loop (false: inline, as in tests)
    retries: 1                   # extra attempts per sleep-stage call
    day_log_max: 60              # most experiences one night looks at (the most important, then the newest)
    consolidate_max: 12          # stage 1: at most this many things that mattered
    core_per_night: 1            # stage 2
    long_term_per_night: 5       # stage 3
    pref_min_samples: 3          # stage 5: experiences of a subject needed to judge it ...
    pref_window_days: 3          # ... within this many sim days
    pref_threshold: 0.02         # |mood signal| needed for a preference
    pref_step: 0.2               # a preference moves at most this far toward its signal per night
    pref_decay: 0.05             # and drifts this far toward 0 on a night without evidence
    pref_weight: 0.5             # mood effects x (1 + weight x valence x confidence) for liked/disliked subjects
    pref_note_min: 0.15          # |valence x confidence| at which the menu mentions it
    dev_min_evidence: 5          # stage 6: a change needs this many of its own experiences ...
    dev_min_days: 3              # ... spread over this many different sim days
    dev_max_step: 0.05           # a trait or tendency strength moves at most this far per change
    dev_new_strength: 0.2        # a new trait or tendency starts here
    dev_cooldown_days: 3         # the same trait or tendency is not changed again for this long
    dev_forbidden_words: [lie, lying, deceive, deceitful, cruel, harm, hurt, destroy, steal, dishonest]
  memory:                        # §5.1, §5.3
    recall_k: 5                  # long-term memories recalled into the Mind
    notable_k: 5                 # today's notable moments shown in the Mind
    notable_min_importance: 0.5  # an experience is notable from this importance (or when it asked to be remembered)
    w_recency: 1.0               # recall score = w_recency x recency + w_importance x importance + w_relevance x similarity
    w_importance: 1.0
    w_relevance: 1.5
    recency_half_life_days: 2    # SIM days
    recall_boost: 0.2            # retention = importance x recency x (1 + recalls x boost)
    forget_below: 0.05           # stage 7 forgets long-term memories whose retention falls below this
    dup_threshold: 0.92          # stage 7 merges memories this similar
    recall_rest_minutes: 90      # SIM minutes a memory rests after being on its mind (so others get their turn) ...
    recall_rest_factor: 0.3      # ... its recall score is multiplied by this while it rests
    wander_slots: 1              # recall slots kept for an important memory not thought about for a while ...
    wander_after_minutes: 360    # ... at least this many SIM minutes
    learned_k: 2                 # things it kept from reading shown in the Mind (the newest, and one older one) ...
    learned_days: 14             # ... kept within this many SIM days
    learned_chars: 240           # each shortened to this many characters
    long_cap: 80                 # long-term memories kept at most: a new one pushes out the weakest (stage 7)
  loops:                         # open loops (§5.8): things on its mind that are not settled yet
    max_open: 5                  # at most this many open; a new one pushes out the oldest
    per_night: 2                 # sleep may open at most this many a night
    expire_days: 10              # SIM days: an open loop nobody settled fades
    on_mind: 5                   # shown in the Mind
    text_chars: 160              # each loop's words are shortened to this
  repetition:                    # §6: behaviour history and freshness
    half_life_minutes: 120       # SIM minutes: how fast a past instance stops counting as a repeat
    w_action: 0.25               # freshness = 1 - w_action x same action - w_family x same family
    w_family: 0.1                #             - w_target x same target - w_aimless x an aimless return
    w_target: 0.3
    w_aimless: 0.3
    freshness_min: 0.1           # freshness never falls below this
    window_hours: 24             # SIM hours of history looked at
    restart_window_minutes: 30   # starting the same thing again this soon after finishing it is a restart ...
    w_place: 0.05                # everything done in the place it is staying in goes a little stale (long stays)
    w_restart: 0.35              # ... which, with nothing it is about changed, costs this much freshness at once
    note_below: 0.6              # options below this freshness get a note on the menu
    recent: 5                    # activities averaged for the repetition score (derived conditions)
    thought_window: 10           # a thought is compared with this many recent thoughts ...
    thought_dup_threshold: 0.9   # ... and is "the same" from this similarity
    thought_theme_window: 20     # the same theme in other words: a thought is compared with this many recent thoughts ...
    thought_theme_threshold: 0.8 # ... they "go the same way" from this similarity (below the near-copy threshold) ...
    thought_theme_min: 3         # ... and with this many of them it is a theme: it is quoted back and shown as mulling
    empty_below: 0.4             # an activity this stale ends with a plain "nothing new came of it" line
    thought_dup_mood: -0.02      # mood for a repeated thought ...
    thought_dup_cooldown_minutes: 60   # ... at most once per this many SIM minutes (mood drift outpaces it)
    reflection_window: 5         # a night's summary is compared with this many earlier ones
    reflection_dup_threshold: 0.9
    reflection_dup_mood: -0.03   # x the number of nights in a row it repeated itself
    subject_floor: 0.72          # §6.6: subjects at least this similar (embeddings) count as the same subject ...
    subject_weight: 0.45         # ... and lower freshness by weight x decayed closeness
    subject_half_life_minutes: 480   # SIM minutes: a subject stays "recent" longer than an action does
    subject_window: 14           # recent subjects compared
    dwell_min: 3                 # this many close subjects recently: the Mind says it keeps coming back to it
