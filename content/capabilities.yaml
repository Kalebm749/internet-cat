# Code capabilities that actions may use (docs/rewrite-contracts.md §4.6). An action naming a capability that
# is disabled, over its limit or missing a permission is not offered. Limits are per sim day.
read_message:
  enabled: true
  handler: cat.capabilities.read_message    # gives the chosen visitor message to the creature as perception
  limits: {per_day: 50}
look_at_drawing:
  enabled: true
  handler: cat.capabilities.look_at_drawing   # what is on a drawing and how it developed (read only)
  limits: {per_day: 200}
draw:
  enabled: true
  handler: cat.capabilities.draw
  permissions: {writes_artifacts: true}
  limits: {per_day: 6, llm_calls_per_use: 1}
write:
  enabled: false                            # until the capability exists
  handler: cat.capabilities.write
  permissions: {writes_artifacts: true}
  limits: {per_day: 10, max_chars: 2000}
web_search:
  enabled: false                            # off at start; enabling it later needs an API key and an allowed host
  handler: cat.capabilities.web_search
  limits: {per_day: 5, max_results: 3}

wikipedia:
  enabled: true
  handler: cat.capabilities.wikipedia
  limits: {per_day: 20}
  # A query or a page title containing one of these (case-insensitive) finds nothing. Yours to edit; [] turns it off.
  blocklist: [pornograph, porn star, erotica, sexually explicit, suicide method, self-harm method, make a bomb, build a bomb]
