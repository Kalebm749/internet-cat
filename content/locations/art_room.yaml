id: art_room
name: the art room
description: >
  A small, quiet room opens off the fountain court. Natural light moves across an old wooden desk
  beneath a broad window. Paper rests beside pencils, charcoal, ink and brushes; a few older drawings
  hang on the walls, and a shelf holds work set aside. There is a chair pulled close to the desk, with
  room to sit, look, and let the place settle around you.
exits: [fountain]
sheltered: true

facts:
  artworks: { type: list, default: [], visible: summary }
  paper: { type: int, default: 12, min: 0, max: 12, visible: full, regrow: { amount: 1, every_hours: 24 } }

events: []

actions:
  - id: make_drawing
    diary: "{name} is sketching a picture: {inputs.intention}"
    name: sketch a picture
    description: "Choose what interests you and make a first pass. Leave it as unfinished work so you can return to it and decide what it needs."
    family: art
    discovery: known_on_arrival
    requires:
      - { energy_gte: 0.15 }
      - { fact_gte: [art_room.paper, 1] }
    inputs:
      intention: { type: text, max_chars: 500, prompt: "What do you want to draw? Choose your own subject and describe your intention." }
      thoughts: { type: text, max_chars: 1000, prompt: "What thoughts, feelings, observations, or memories are with you as you draw?" }
    duration: { minutes: [5, 12] }
    effort: low
    capability: draw
    on_finish:
      world:
        - { op: add, fact: art_room.paper, value: -1 }
        - op: append
          fact: art_room.artworks
          value:
            id: "{capability.id}"
            title: "{capability.title}"
            created_at: "{capability.created_at}"
            subject: "{capability.subject}"
            description: "{capability.description}"
            thoughts: "{capability.thoughts}"
            svg: "{capability.svg}"
            status: "{capability.status}"
            revision_of: "{capability.revision_of}"
      creature: { mood: 0.02 }
      remember: { importance: 0.65, text: "I spent time drawing {capability.title}. I was thinking: {capability.thoughts}" }

  - id: study_drawing
    diary: "{name} is studying a drawing"
    name: study a drawing
    description: "Sit with a drawing for a while. Look closely, interpret what you see, and notice what you feel or prefer."
    family: art
    discovery: known_on_arrival
    requires: [{ fact_count_gte: [art_room.artworks, 1] }]
    inputs:
      artwork: { type: choice, options: "{fact:art_room.artworks.labels}" }
    duration: { minutes: [10, 30] }
    effort: none
    revisit_key: [art_room.artworks]
    on_finish:
      remember: { importance: 0.55, text: "I spent time studying a drawing in the art room and formed my own thoughts about it." }

  - id: work_on_drawing
    diary: "{name} is making another pass on a picture: {inputs.intention}"
    name: make another pass on a drawing
    description: "Choose an unfinished drawing and make one focused pass on it. You can return to it again or decide it is finished."
    family: art
    discovery: known_on_arrival
    requires:
      - { energy_gte: 0.15 }
      - { fact_count_where: [art_room.artworks, {status: unfinished}, 1] }
      - { fact_gte: [art_room.paper, 1] }
    inputs:
      artwork: { type: choice, options: "{fact:art_room.artworks.unfinished.labels}" }
      intention: { type: text, max_chars: 500, prompt: "What, if anything, do you want to do with this drawing? You may change your mind." }
      thoughts: { type: text, max_chars: 1000, prompt: "What are you thinking or feeling as you return to it?" }
    duration: { minutes: [5, 12] }
    effort: low
    capability: draw
    revisit_key: [art_room.artworks]
    on_finish:
      world:
        - { op: add, fact: art_room.paper, value: -1 }
        - op: update_where
          fact: art_room.artworks
          match: { id: "{inputs.artwork}", status: unfinished }
          set: { status: superseded }
        - op: append
          fact: art_room.artworks
          value:
            id: "{capability.id}"
            title: "{capability.title}"
            created_at: "{capability.created_at}"
            subject: "{capability.subject}"
            description: "{capability.description}"
            thoughts: "{capability.thoughts}"
            svg: "{capability.svg}"
            status: "{capability.status}"
            revision_of: "{capability.revision_of}"
      creature: { mood: 0.01 }
      remember: { importance: 0.7, text: "I returned to a drawing and made another version: {capability.title}. I was thinking: {capability.thoughts}" }

  - id: finish_drawing
    diary: "{name} is finishing a drawing"
    name: finish a drawing
    description: "Choose an unfinished drawing and decide it is ready to keep as finished work."
    family: art
    discovery: known_on_arrival
    requires: [{ fact_count_where: [art_room.artworks, {status: unfinished}, 1] }]
    inputs:
      artwork: { type: choice, options: "{fact:art_room.artworks.unfinished.labels}" }
    duration: { minutes: [2, 5] }
    effort: none
    on_finish:
      world:
        - op: update_where
          fact: art_room.artworks
          match: { id: "{inputs.artwork}", status: unfinished }
          set: { status: completed, completed_at: "{now}" }
      creature: { mood: 0.02 }
      remember: { importance: 0.6, text: "I decided to finish a drawing in the art room." }
