id: art_room
name: the art room
description: >
  A small, quiet room opens off the fountain court. Natural light moves across an old wooden desk
  beneath a broad window. A stack of paper rests beside a cup of pencils, a box of crayons, a row of
  markers and a soft eraser; a few older drawings hang on the walls, and a shelf holds work set aside.
  There is a chair pulled close to the desk, with room to sit, look, and let the place settle around you.
exits: [fountain]
sheltered: true

facts:
  artworks: { type: list, default: [], visible: summary }
  paper: { type: int, default: 12, min: 0, max: 12, visible: full, regrow: { amount: 1, every_hours: 24 } }
  # The art supplies on the desk (cat/art/materials.py). Each is one physical thing: what it is, its colour or
  # hardness. Wear, running out and new supplies are changes to this list, not to code.
  supplies:
    type: list
    visible: summary
    default:
      - { id: pencil_hb, kind: pencil, name: "an HB pencil", hardness: HB }
      - { id: pencil_2b, kind: pencil, name: "a 2B pencil", hardness: 2B }
      - { id: pencil_4b, kind: pencil, name: "a 4B pencil", hardness: 4B }
      - { id: marker_black, kind: marker, name: "a black marker", color: "#1f1d22", color_name: black }
      - { id: marker_red, kind: marker, name: "a red marker", color: "#d4313a", color_name: red }
      - { id: marker_blue, kind: marker, name: "a blue marker", color: "#2a5fb8", color_name: blue }
      - { id: marker_green, kind: marker, name: "a green marker", color: "#23864a", color_name: green }
      - { id: marker_yellow, kind: marker, name: "a yellow marker", color: "#f3c623", color_name: yellow }
      - { id: marker_orange, kind: marker, name: "an orange marker", color: "#ee7d22", color_name: orange }
      - { id: crayon_red, kind: crayon, name: "a red crayon", color: "#c8372d", color_name: red }
      - { id: crayon_orange, kind: crayon, name: "an orange crayon", color: "#e8792b", color_name: orange }
      - { id: crayon_yellow, kind: crayon, name: "a yellow crayon", color: "#f2c43a", color_name: yellow }
      - { id: crayon_green, kind: crayon, name: "a green crayon", color: "#3f8f4a", color_name: green }
      - { id: crayon_blue, kind: crayon, name: "a blue crayon", color: "#2f63b5", color_name: blue }
      - { id: crayon_purple, kind: crayon, name: "a purple crayon", color: "#6d3f9e", color_name: purple }
      - { id: crayon_brown, kind: crayon, name: "a brown crayon", color: "#7a4a2a", color_name: brown }
      - { id: crayon_black, kind: crayon, name: "a black crayon", color: "#26232a", color_name: black }
      - { id: eraser, kind: eraser, name: "a soft eraser" }

events: []

actions:
  - id: make_drawing
    diary: "{name} is sketching a picture: {inputs.intention}"
    subject: "{inputs.intention}"
    name: sketch a picture
    description: "Choose what interests you and make a first pass. Leave it as unfinished work so you can return to it and decide what it needs."
    family: art
    project: made
    inner: {expression: -0.4, novelty: -0.1}
    discovery: known_on_arrival
    requires:
      - { energy_gte: 0.15 }
      - { fact_gte: [art_room.paper, 1] }
    inputs:
      intention: { type: text, max_chars: 500, prompt: "What do you want to draw? Choose your own subject and describe your intention." }
      thoughts: { type: text, max_chars: 1000, prompt: "What thoughts, feelings, observations, or memories are with you as you draw?" }
      materials: { type: text, max_chars: 300, prompt: "Which supplies do you pick up, and how will you use them? (pencils HB, 2B, 4B; markers black, red, blue, green, yellow, orange; crayons red, orange, yellow, green, blue, purple, brown, black; an eraser)" }
      effort: { type: choice, options: [quick, careful, patient] }
    duration: { minutes: [5, 12] }
    effort: low
    capability: draw
    on_finish:
      world:
        - { op: add, fact: art_room.paper, value: -1 }
        - op: append
          fact: art_room.artworks
          value:
            id: "{capability.id}"
            title: "{capability.title}"
            created_at: "{capability.created_at}"
            subject: "{capability.subject}"
            description: "{capability.description}"
            thoughts: "{capability.thoughts}"
            materials: "{capability.materials}"
            format: "{capability.format}"
            root_id: "{capability.root_id}"
            status: "{capability.status}"
            revision_of: "{capability.revision_of}"
      creature: { mood: 0.02 }
      remember: { importance: 0.65, text: "I spent time drawing {capability.title} with {capability.materials}. I was thinking: {capability.thoughts}" }

  - id: study_drawing
    diary: "{name} is studying a drawing"
    name: study a drawing
    description: "Sit with a drawing for a while. Look closely, interpret what you see, and notice what you feel or prefer."
    family: art
    project: studied
    inner: {novelty: -0.15, expression: -0.05}
    discovery: known_on_arrival
    requires: [{ fact_count_gte: [art_room.artworks, 1] }]
    inputs:
      artwork: { type: choice, options: "{fact:art_room.artworks.labels}" }
    duration: { minutes: [10, 30] }
    effort: none
    capability: look_at_drawing
    revisit_key: [art_room.artworks]
    on_finish:
      remember: { importance: 0.55, text: "I studied my drawing {capability.title} ({capability.versions} versions) and formed my own thoughts about it. {capability.feeling}" }

  - id: work_on_drawing
    diary: "{name} is making another pass on a picture: {inputs.intention}"
    name: make another pass on a drawing
    description: "Choose an unfinished drawing and make one focused pass on it. You can return to it again or decide it is finished."
    family: art
    repeat_limit: {max: 8}
    project: reworked
    inner: {expression: -0.25, accomplishment: -0.05}
    discovery: known_on_arrival
    requires:
      - { energy_gte: 0.15 }
      - { fact_count_where: [art_room.artworks, {status: unfinished}, 1] }
      - { fact_gte: [art_room.paper, 1] }
    inputs:
      artwork: { type: choice, options: "{fact:art_room.artworks.unfinished.labels}" }
      intention: { type: text, max_chars: 500, prompt: "What, if anything, do you want to do with this drawing? You may change your mind." }
      thoughts: { type: text, max_chars: 1000, prompt: "What are you thinking or feeling as you return to it?" }
      materials: { type: text, max_chars: 300, prompt: "Which supplies do you pick up this time, and how will you use them? (pencils HB, 2B, 4B; markers; crayons; an eraser)" }
      effort: { type: choice, options: [quick, careful, patient] }
    duration: { minutes: [5, 12] }
    effort: low
    capability: draw
    # no revisit_key: each pass makes a new version, which must not make the next pass look fresh.
    # Continuing a drawing is never an immediate repeat (each pass names a new version), but passes add up.
    on_finish:
      world:
        - { op: add, fact: art_room.paper, value: -1 }
        - op: update_where
          fact: art_room.artworks
          match: { id: "{inputs.artwork}", status: unfinished }
          set: { status: superseded }
        - op: append
          fact: art_room.artworks
          value:
            id: "{capability.id}"
            title: "{capability.title}"
            created_at: "{capability.created_at}"
            subject: "{capability.subject}"
            description: "{capability.description}"
            thoughts: "{capability.thoughts}"
            materials: "{capability.materials}"
            format: "{capability.format}"
            root_id: "{capability.root_id}"
            status: "{capability.status}"
            revision_of: "{capability.revision_of}"
      creature: { mood: 0.01 }
      remember: { importance: 0.7, text: "I returned to a drawing and made another version: {capability.title}, with {capability.materials}. I was thinking: {capability.thoughts}" }

  - id: finish_drawing
    diary: "{name} is finishing a drawing"
    name: finish a drawing
    description: "Choose an unfinished drawing and decide it is ready to keep as finished work."
    family: art
    project: finished
    inner: {accomplishment: -0.45, satisfaction: 0.12, confidence: 0.05}
    discovery: known_on_arrival
    requires: [{ fact_count_where: [art_room.artworks, {status: unfinished}, 1] }]
    inputs:
      artwork: { type: choice, options: "{fact:art_room.artworks.unfinished.labels}" }
    duration: { minutes: [2, 5] }
    effort: none
    on_finish:
      world:
        - op: update_where
          fact: art_room.artworks
          match: { id: "{inputs.artwork}", status: unfinished }
          set: { status: completed, completed_at: "{now}" }
      creature: { mood: 0.02 }
      remember: { importance: 0.6, text: "I decided to finish a drawing in the art room." }

  - id: abandon_drawing
    diary: "{name} is putting a drawing aside for good"
    name: give up on a drawing
    description: "Decide an unfinished drawing is not going anywhere and leave it as it is, for good."
    family: art
    project: abandoned
    inner: {frustration: -0.1, accomplishment: 0.05}
    discovery: known_on_arrival
    requires: [{ fact_count_where: [art_room.artworks, {status: unfinished}, 1] }]
    inputs:
      artwork: { type: choice, options: "{fact:art_room.artworks.unfinished.labels}" }
    duration: { minutes: [1, 3] }
    effort: none
    on_finish:
      world:
        - op: update_where
          fact: art_room.artworks
          match: { id: "{inputs.artwork}", status: unfinished }
          set: { status: abandoned, abandoned_at: "{now}" }
      creature: { mood: 0.0 }
      remember: { importance: 0.5, text: "I gave up on a drawing; it was not going anywhere." }
