id: market
name: the market stall
description: >
  A single canvas-roofed stall at the edge of the square. Small offerings of food are left on its
  counter, and a wooden mailbox is nailed to its post.
exits: [fountain, lane]
sheltered: true

facts:
  offerings: {type: int, default: 2, min: 0, max: 3, visible: full, regrow: {amount: 1, at_hours: [6, 12, 18]}}
  mailbox: {type: list, default: [], max_len: 50, visible: summary}     # visitor letters: unread / read. Open-ended:
                                                                        # read, unanswered ones stay on Nit's mind (§4.8)
  answered: {type: list, default: [], max_len: 8, visible: summary}      # the board: letters it replied to stay pinned here (§4.8)
  discarded: {type: list, default: [], max_len: 200, visible: summary} # read letters Nit chose not to answer

events:
  - {id: bread_smell, text: "The smell of warm bread drifts from the stall.", sense: smell,
     chance_per_hour: 0.5, hours: [6, 11], salience: 0.5}
  - {id: stallholder_calls, text: "A stallholder calls out a price.", sense: sound,
     chance_per_hour: 0.4, hours: [8, 17]}
  - {id: canvas_flaps, text: "The canvas roof snaps and billows in a gust.", sense: sight, chance_per_hour: 0.2}

actions:
  - id: eat_offering
    diary: "{name} is eating an offering at {location.name}"
    name: eat an offering
    description: "Take one of the small offerings left on the counter, and eat it."
    family: eat
    discovery: known_on_arrival
    requires:
      - {fact_gte: [market.offerings, 1]}
    inner: {stress: -0.05, satisfaction: 0.05}
    duration: {minutes: [5, 10]}
    effort: low
    outcomes:                         # food is better when it is needed
      - when: {hunger_gte: 0.5}
        world: [{op: add, fact: market.offerings, value: -1}]
        creature: {hunger: -0.45, energy: 0.05, mood: 0.12}
        text: "You eat it slowly. When you are this hungry it tastes wonderful."
      - world: [{op: add, fact: market.offerings, value: -1}]
        creature: {hunger: -0.45, energy: 0.05, mood: 0.02}
        text: "You eat it."

  # The letter flow: read a letter, then it MUST decide. Replying keeps the knowledge: the original letter is pinned on
  # the board (room for 8) and may be read again as it was written. Setting it aside throws the knowledge away: nothing
  # it remembers of that letter survives. A pinned letter stays until it takes it down (and then forgets it too).
  - id: read_messages
    diary: "{name} is reading a letter"
    name: read a new letter
    description: "Open the mailbox on the stall post and read a letter. Once you have read it you must decide: write back, or set it aside."
    family: mail
    discovery: known_on_arrival
    requires:
      - {fact_count_where: [market.mailbox, {status: unread}, 1]}
      - {not: {fact_count_where: [market.mailbox, {status: read}, 1]}}      # one decision at a time
    inputs:
      which: {type: choice, options: "{fact:market.mailbox.unread.labels}"}
    inner: {social: -0.3, belonging: -0.1}
    duration: {minutes: [5, 15]}
    effort: low
    capability: read_message
    on_finish:
      world:
        - {op: update_where, fact: market.mailbox, match: {id: "{inputs.which}", status: unread},
           set: {status: read, read_at: "{now}"}}
      discover: [reply_message, discard_message, reread_pinned_letter, take_a_letter_down]
      creature: {mood: 0.05}

  - id: reply_message
    diary: "{name} is writing a reply"
    name: write back and pin the letter
    description: "Write a reply to the letter you have read. The original letter is pinned on your board, so you can read it again."
    family: mail
    discovery: hidden
    requires:
      - {fact_count_where: [market.mailbox, {status: read}, 1]}
      - {not: {fact_count_gte: [market.answered, 8]}}                      # the board has room for only so many
      - {energy_gte: 0.1}
    inputs:
      which: {type: choice, options: "{fact:market.mailbox.read.labels}"}
      reply: {type: text, max_chars: 800, prompt: "What do you write back?"}
    inner: {social: -0.3, belonging: -0.25, expression: -0.15}
    duration: {minutes: [10, 25]}
    effort: medium
    on_finish:
      world:
        - {op: move_where, from: market.mailbox, to: market.answered, match: {id: "{inputs.which}"},
           set: {status: answered, reply: "{inputs.reply}", answered_at: "{now}"}}
      creature: {mood: 0.05}
      remember: {importance: 0.6, text: "I wrote back to a letter and pinned it on my board: {inputs.reply}"}

  - id: discard_message
    diary: "{name} is setting a letter aside"
    name: set the letter aside for good
    description: "Do not write back. The letter is thrown away, and you will not keep anything of it."
    family: mail
    discovery: hidden
    forgets: which
    requires:
      - {fact_count_where: [market.mailbox, {status: read}, 1]}
    inputs:
      which: {type: choice, options: "{fact:market.mailbox.read.labels}"}
    duration: {minutes: [2, 6]}
    effort: low
    on_finish:
      world:
        - {op: move_where, from: market.mailbox, to: market.discarded, match: {id: "{inputs.which}"},
           set: {status: discarded, discarded_at: "{now}"}}

  - id: reread_pinned_letter
    diary: "{name} is rereading a pinned letter"
    name: reread a pinned letter
    description: "Take a letter from your board and read it again exactly as it was written, with what you wrote back. It stays pinned unless you take it down."
    family: mail
    inner: {social: -0.15, belonging: -0.1}
    discovery: hidden
    requires:
      - {fact_count_where: [market.answered, {status: answered}, 1]}
      - {not: {fact_count_where: [market.mailbox, {status: read}, 1]}}      # decide about the letter in hand first
    inputs:
      which: {type: choice, options: "{fact:market.answered.labels}"}
    duration: {minutes: [4, 10]}
    effort: low
    capability: read_message
    on_finish:
      creature: {mood: 0.03}

  - id: take_a_letter_down
    diary: "{name} is taking a letter down from the board"
    name: take a letter down for good
    description: "Take a pinned letter off the board and throw it away. You will not keep anything of it."
    family: mail
    discovery: hidden
    forgets: which
    requires:
      - {fact_count_where: [market.answered, {status: answered}, 1]}
    inputs:
      which: {type: choice, options: "{fact:market.answered.labels}"}
    duration: {minutes: [2, 5]}
    effort: low
    on_finish:
      world:
        - {op: move_where, from: market.answered, to: market.discarded, match: {id: "{inputs.which}"},
           set: {status: discarded, discarded_at: "{now}"}}
