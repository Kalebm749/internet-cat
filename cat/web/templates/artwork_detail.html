<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ artwork.title }} · Nit</title><link rel="stylesheet" href="/static/css/site.css"><link rel="icon" href="/static/img/nit/nit.svg"></head>
<body><header class="top"><img class="portrait" src="/static/img/nit/nit.svg" alt=""><div><h1>{{ artwork.title }}</h1><p class="where">{{ artwork.created_at }} · <a href="/artwork">Back to artwork</a></p></div><nav class="tabs"><a href="/">Now &amp; diary</a> <a href="/places">Places &amp; wishes</a> <a href="/artwork" class="on">Artwork</a> <a href="/letters">Letters</a></nav></header>
<main class="layout"><section class="col" style="grid-column: span 2"><article class="card art-detail"><img src="/artwork/image/{{ artwork.id }}.svg" alt="{{ artwork.description }}"><p>{{ artwork.description }}</p><p class="hint">{{ artwork.subject }}</p>{% if artwork.thoughts %}<blockquote class="thought">{{ artwork.thoughts }}</blockquote>{% endif %}{% if artwork.revision_of %}<p class="hint">Revisited from an earlier drawing.</p>{% endif %}</article></section></main></body></html>
